name: Update Profile README

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest public activity & update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json
          import urllib.request
          import os
          from datetime import datetime

          url = "https://api.github.com/users/zlluska/repos?sort=pushed&per_page=6"
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "User-Agent": "zlluska-profile-updater"
          })
          token = os.environ.get("GH_TOKEN")
          if token:
              req.add_header("Authorization", f"Bearer {token}")

          with urllib.request.urlopen(req) as resp:
              repos = json.loads(resp.read().decode("utf-8"))

          lines = []
          for r in repos:
              if r["name"].lower() == "zlluska" or r.get("archived"):
                  continue
              pushed = r.get("pushed_at", "")[:10]
              lang = r.get("language") or "Markdown"
              desc = (r.get("description") or "").strip()
              lines.append(f"- 🔄 **[`{r['name']}`]({r['html_url']})** (`{lang}`) — *{desc}* *(último push: `{pushed}`)*")
              if len(lines) >= 4:
                  break

          block = "<!-- START_RECENT_REPOS -->\n" + "\n".join(lines) + "\n<!-- END_RECENT_REPOS -->"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          import re
          new_content = re.sub(
              r"<!-- START_RECENT_REPOS -->.*?<!-- END_RECENT_REPOS -->",
              block,
              content,
              flags=re.DOTALL
          )

          if new_content != content:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("README.md updated.")
          else:
              print("No changes needed.")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: atualiza atividade recente automaticamente" && git push)
